<title>자신감 UP 자존감 UP</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
/* 태블릿용: 교실 그림 + 자신감 UP 방법 5가지(생각 바꾸기·크게 외치기·상상하기·참모습·나를 표현하기), 직접 그린 SVG, 큰 터치 버튼 */
:root{
  --bg:#F3F6FA; --paper:#FFFFFF; --ink:#1D1D1D; --muted:#575C66; --line:#D7DDE8;
  --navy:#173F7A; --navy-soft:#E5ECF7; --accent:#D50D76; --ok:#1E7B4F; --ok-soft:#E3F3EA; --bad:#B4232F; --bad-soft:#FBE7E9;
  --d1:#2E9CC0; --d2:#22A05A; --d3:#C8323C; --d4:#E08A1E; --sun:#FFC000; --sun-soft:#FFF3C4;
  --wall:#E6EEF6; --floor:#CBD5E1; --wood:#C8975A; --wood-dark:#9A6E3A; --sky:#BFE3F7; --metal:#8C99AB; --screen:#DDEBFA; --note:#FFF4BF;
  --leaf:#3F9A63; --grass:#7CC36A; --board:#2F5D4A; --chalk:#F4F6FA; --curtain:#B4232F; --stagebg:#3A2E4A; --spot:#FFF6C9; --homewall:#F6E7D6;
  --water:#9ED8F5; --face:#FFD43B; --faceline:#6B4E00; --skin:#F2C9A0; --eye:#1D1D1D; --pants:#3A4A63; --pink:#F7A8C6; --pinkd:#D9638F; --mane:#D9822B; --pot:#B5653F; --dark:#2B3445;
  --font:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif; --display:"Jua","Noto Sans KR",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1522; --paper:#18212F; --ink:#EEF1F6; --muted:#AAB3C2; --line:#2B3647;
  --navy:#9DB6EA; --navy-soft:#22304A; --accent:#F25AA8; --ok:#5CC98E; --ok-soft:#173226; --bad:#F07A83; --bad-soft:#3A1C21;
  --d1:#5BBCDD; --d2:#5CC98E; --d3:#F07A83; --d4:#F2A64A; --sun:#E7B640; --sun-soft:#3A3218;
  --wall:#1C2636; --floor:#141C29; --wood:#7A5A36; --wood-dark:#553D22; --sky:#27405C; --metal:#6B7890; --screen:#2A3B55; --note:#3B3620;
  --leaf:#4FAE78; --grass:#3E7A3A; --board:#1F3D31; --chalk:#E6EBF2; --curtain:#8E2530; --stagebg:#1E1828; --spot:#4A4426; --homewall:#3A2F26;
  --water:#3F7FA6; --face:#E9BE2A; --faceline:#3B2C00; --pants:#2A3548; --pink:#C77A98; --pinkd:#A2486C; --mane:#B06A22; --pot:#8A4E33; --dark:#0F1522; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1522; --paper:#18212F; --ink:#EEF1F6; --muted:#AAB3C2; --line:#2B3647;
  --navy:#9DB6EA; --navy-soft:#22304A; --accent:#F25AA8; --ok:#5CC98E; --ok-soft:#173226; --bad:#F07A83; --bad-soft:#3A1C21;
  --d1:#5BBCDD; --d2:#5CC98E; --d3:#F07A83; --d4:#F2A64A; --sun:#E7B640; --sun-soft:#3A3218;
  --wall:#1C2636; --floor:#141C29; --wood:#7A5A36; --wood-dark:#553D22; --sky:#27405C; --metal:#6B7890; --screen:#2A3B55; --note:#3B3620;
  --leaf:#4FAE78; --grass:#3E7A3A; --board:#1F3D31; --chalk:#E6EBF2; --curtain:#8E2530; --stagebg:#1E1828; --spot:#4A4426; --homewall:#3A2F26;
  --water:#3F7FA6; --face:#E9BE2A; --faceline:#3B2C00; --pants:#2A3548; --pink:#C77A98; --pinkd:#A2486C; --mane:#B06A22; --pot:#8A4E33; --dark:#0F1522; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:20px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px;
  -webkit-user-select:none;user-select:none}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;justify-content:space-between}
h1{font-family:var(--display);font-weight:400;font-size:32px;color:var(--navy);margin:0;line-height:1.2}
h1 .y{color:var(--d4)}
.badge{font-size:16px;font-weight:700;padding:6px 14px;border-radius:999px;background:var(--navy-soft);color:var(--navy)}
button,input{font-family:inherit}
button{font-size:20px;font-weight:700;border-radius:14px;border:2px solid var(--line);background:var(--paper);color:var(--ink);padding:14px 18px;cursor:pointer;min-height:60px;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:4px solid var(--accent);outline-offset:2px}
button:active{transform:scale(.98)}
button:disabled{opacity:.45;cursor:default}
.primary{background:var(--navy);color:var(--paper);border-color:var(--navy)}
.ghost{background:transparent}
button.sel{border-color:var(--navy);border-width:4px;background:var(--navy-soft);color:var(--navy)}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:20px;min-height:190px}
.tile .nm{font-size:25px;font-weight:900;color:var(--navy)}
.tile .ds{font-size:17px;color:var(--muted);font-weight:500}
.areas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.area{display:flex;flex-direction:column;gap:12px;background:var(--paper);border:1px solid var(--line);border-top:8px solid var(--c);border-radius:18px;padding:16px;min-width:0}
.area .tiles{grid-template-columns:1fr;gap:12px}
.area .tile{background:var(--bg);flex-direction:row;align-items:center;gap:12px;min-height:116px;padding:14px}
.area .tile svg{width:96px;height:72px;flex:none}
.area .tile .nm{font-size:22px}
.tx{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}
@media (max-width:760px){.areas{grid-template-columns:1fr}}
.donetag{background:var(--ok-soft);color:var(--ok);font-weight:900;padding:4px 12px;border-radius:999px;font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.q{font-size:22px;font-weight:700}
.sub{font-size:17px;color:var(--muted)}
.fb{font-size:22px;font-weight:900;min-height:34px}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.progress{display:flex;gap:6px}
.progress i{width:28px;height:10px;border-radius:5px;background:var(--line)}
.progress i.on{background:var(--navy)}
.scene{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--wall)}
.scene svg{display:block;width:100%;height:auto}
.order{background:var(--note);border:2px solid var(--wood-dark);border-top-width:14px;border-radius:14px;padding:16px 20px;display:flex;flex-direction:column;gap:8px}
.big{font-size:26px;font-weight:700}
.big b{color:var(--accent);font-size:30px}
.steps{display:flex;flex-wrap:wrap;gap:8px}
.steps span{padding:6px 14px;border-radius:999px;background:var(--navy-soft);color:var(--navy);font-weight:700;font-size:17px}
.steps span.cur{background:var(--accent);color:var(--paper)}
.steps span.past{opacity:.55}
.todo{font-size:24px;font-weight:900;color:var(--accent)}
.stepno{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--paper);font-weight:900;font-size:18px;flex:none}
.now{outline:5px solid var(--accent);outline-offset:3px;animation:glow .9s ease-in-out infinite alternate}
@keyframes glow{from{outline-color:var(--accent)}to{outline-color:transparent}}
/* 고르기 칸 */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.choice{display:flex;align-items:center;gap:12px;text-align:left;min-height:84px;font-size:21px}
.choice svg{width:52px;height:52px;flex:none}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.pick{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:140px;font-size:19px;padding:12px 8px}
.pick svg{width:72px;height:72px}
.pick.an svg{width:96px;height:96px}
/* 생각 바꾸기 */
.think{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:18px;align-items:center}
.think .pic{background:var(--wall);border-radius:14px;padding:10px}
.think .pic svg{width:100%;height:auto;display:block}
.sitx{font-size:28px;font-weight:900}
.mind{display:flex;align-items:center;gap:14px}
.mind svg.face{width:96px;height:96px;flex:none}
.cloud{position:relative;flex:1;min-width:0;background:var(--bg);border:3px solid var(--line);border-radius:28px;padding:14px 18px;font-size:22px;font-weight:900;min-height:70px;display:flex;align-items:center}
.cloud.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.cloud.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cloud::before{content:"";position:absolute;left:-16px;top:50%;width:14px;height:14px;border-radius:50%;background:inherit;border:3px solid;border-color:inherit}
.meter{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;color:var(--muted)}
.meter .bar{flex:1;height:18px;border-radius:9px;background:var(--line);overflow:hidden}
.meter .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--d3),var(--sun),var(--d2));transition:width .5s}
@media (max-width:640px){.think{grid-template-columns:1fr}}
/* 크게 외치기 */
.shoutbox{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr) 64px;gap:16px;align-items:center;background:var(--wall);border-radius:18px;padding:16px}
.shoutbox svg.who{width:100%;height:auto;display:block}
.say{background:var(--paper);border:4px solid var(--navy);border-radius:22px;padding:16px 20px;font-family:var(--display);color:var(--navy);line-height:1.25;text-align:center;transition:font-size .3s;min-width:0;overflow-wrap:anywhere}
.vol{display:flex;flex-direction:column-reverse;gap:6px;height:100%;justify-content:flex-start}
.vol i{height:26px;border-radius:6px;background:var(--line)}
.vol i.on:nth-child(1),.vol i.on:nth-child(2){background:var(--d2)}
.vol i.on:nth-child(3),.vol i.on:nth-child(4){background:var(--sun)}
.vol i.on:nth-child(5){background:var(--d3)}
@media (max-width:640px){.shoutbox{grid-template-columns:minmax(0,1fr) 48px}.shoutbox svg.who{grid-column:1/-1;max-width:240px;margin:0 auto}}
.builder{display:flex;flex-direction:column;gap:10px;border:2px dashed var(--metal);border-radius:14px;padding:14px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips button{min-height:56px;border-radius:999px;padding:8px 18px;font-size:20px}
.chips .no{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--paper);font-size:16px;margin-right:6px}
/* 상상하기 */
.stage{border-radius:18px;overflow:hidden;border:3px solid var(--navy)}
.stage svg{display:block;width:100%;height:auto}
.dream{font-family:var(--display);font-size:28px;color:var(--navy);text-align:center;line-height:1.4}
.timer{font-family:var(--display);font-size:64px;line-height:1;color:var(--accent);text-align:center;font-variant-numeric:tabular-nums}
/* 참모습 */
.mirrorwrap{display:grid;grid-template-columns:minmax(0,240px) minmax(0,1fr);gap:18px;align-items:center}
.mirrorwrap svg{width:100%;height:auto;display:block}
@media (max-width:640px){.mirrorwrap{grid-template-columns:1fr}.mirrorwrap svg{max-width:220px;margin:0 auto}}
.write{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.write input{flex:1 1 220px;min-width:0;font-size:22px;font-weight:700;padding:12px 16px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);min-height:60px}
.hcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.hcard{min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-radius:16px;padding:12px;font-size:19px;text-align:center}
.hcard.back{background:var(--navy);color:var(--paper);border-color:var(--navy);background-image:repeating-linear-gradient(45deg,transparent 0 10px,rgba(255,255,255,.08) 10px 20px)}
.hcard.back b{font-family:var(--display);font-size:48px;line-height:1}
.hcard.open{background:var(--note);border:2px solid var(--wood-dark);font-weight:700;cursor:default}
.hcard.open svg{width:56px;height:56px}
.answer{font-family:var(--display);font-size:34px;color:var(--accent);text-align:center}
/* 나를 표현하기 */
.present{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:18px;align-items:center}
.present svg{width:100%;height:auto;display:block}
.script{background:var(--paper);border:3px solid var(--d4);border-radius:8px;padding:20px 22px;font-size:24px;line-height:1.75;box-shadow:5px 5px 0 var(--line)}
.script b{color:var(--accent)}
@media (max-width:640px){.present{grid-template-columns:1fr}.present svg{max-width:200px;margin:0 auto}}
/* 마무리 */
.stamp{align-self:center;width:150px;height:150px;border:6px solid var(--accent);border-radius:50%;color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:26px;line-height:1.2;text-align:center;transform:rotate(-10deg)}
.stamp small{font-size:16px}
.idcard{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;border:3px solid var(--navy);border-radius:18px;padding:18px;background:var(--paper);box-shadow:6px 6px 0 var(--line);-webkit-user-select:text;user-select:text}
.idcard .ph{background:var(--wall);border-radius:12px;padding:8px;align-self:start}
.idcard .ph svg{width:100%;height:auto;display:block}
.idcard .nm{font-family:var(--display);font-size:32px;color:var(--navy)}
.mrow{display:grid;grid-template-columns:140px minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:19px}
.mrow:last-child{border-bottom:0}
.mrow .k{font-weight:900;color:var(--navy)}
.mrow .v.empty{color:var(--muted)}
@media (max-width:600px){.idcard{grid-template-columns:1fr}.idcard .ph{max-width:160px}.mrow{grid-template-columns:1fr;gap:2px}}
.namefield{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.namefield input{font-size:22px;font-weight:700;padding:12px 16px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);min-height:56px;width:min(100%,240px)}
.settings{border-top:1px solid var(--line);padding-top:14px}
.pop{animation:pop .35s}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.05)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.now,.pop{animation:none}.say,.meter .bar i{transition:none}}
</style>

<div class="wrap" id="app"></div>

<script>
/* ================= 그림 (모두 직접 그린 SVG) ================= */
const E='var(--eye)';
function person(x,g,s,shirt,o){o=o||{};const arm=o.arm||'down',sk='var(--skin)';
  const A={down:'M-14 -64L-22 -36M14 -64L22 -36',clap:'M-14 -64L-4 -100M14 -64L4 -100',up:'M-14 -64L-30 -100M14 -64L30 -100',
    thumb:'M-14 -64L-22 -36M14 -64L30 -96',mic:'M-14 -64L-22 -36M14 -64L26 -74L18 -82',point:'M-14 -64L-22 -36M14 -64L44 -72',hips:'M-14 -64L-30 -50L-17 -40M14 -64L30 -50L17 -40'}[arm];
  const H={down:[[-22,-36],[22,-36]],clap:[[-3,-102],[3,-102]],up:[[-30,-100],[30,-100]],thumb:[[-22,-36],[30,-98]],mic:[[-22,-36],[18,-82]],point:[[-22,-36],[45,-72]],hips:[]}[arm];
  const mouth={smile:`<path d="M-6 -80q6 6 12 0" fill="none" stroke="${E}" stroke-width="2.2" stroke-linecap="round"/>`,big:`<path d="M-8 -82q8 11 16 0z" fill="${E}"/><circle cx="-10" cy="-83" r="3.2" fill="var(--pink)"/><circle cx="10" cy="-83" r="3.2" fill="var(--pink)"/>`,
    sad:`<path d="M-6 -77q6 -6 12 0" fill="none" stroke="${E}" stroke-width="2.2" stroke-linecap="round"/>`,open:`<ellipse cx="0" cy="-79" rx="6" ry="5" fill="${E}"/>`}[o.face||'smile'];
  let ex='';
  if(arm==='clap')ex+=`<path d="M-14 -108l-6-4M-12 -116l-4-6M14 -108l6-4M12 -116l4-6" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round"/>`;
  if(arm==='thumb')ex+=`<rect x="27" y="-114" width="6" height="14" rx="3" fill="${sk}"/>`;
  if(arm==='mic')ex+=`<rect x="13" y="-98" width="10" height="16" rx="5" fill="var(--dark)"/><path d="M18 -82v10" stroke="var(--metal)" stroke-width="3"/>`;
  if(o.glasses)ex+=`<g fill="none" stroke="${E}" stroke-width="1.8"><circle cx="-6" cy="-89" r="5"/><circle cx="6" cy="-89" r="5"/><path d="M-1 -89h2"/></g>`;
  if(o.tie)ex+=`<path d="M0 -70l-4 5 4 16 4-16z" fill="var(--accent)"/>`;
  if(o.hat)ex+=`<path d="M-15 -100h30v-6a9 9 0 0 0-4-15 10 10 0 0 0-18-2 9 9 0 0 0-8 17z" fill="var(--paper)" stroke="var(--line)" stroke-width="2"/>`;
  if(o.voice)ex+=`<path d="M22 -86q6 6 0 12M28 -92q12 12 0 24M34 -98q18 18 0 36" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>`;
  if(o.shine)ex+=`<path d="M-34 -110l3 7 7 3-7 3-3 7-3-7-7-3 7-3zM34 -40l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="var(--sun)"/>`;
  return `<g transform="translate(${x} ${g}) scale(${s})"><rect x="-11" y="-34" width="9" height="34" rx="3" fill="var(--pants)"/><rect x="2" y="-34" width="9" height="34" rx="3" fill="var(--pants)"/>
<rect x="-17" y="-72" width="34" height="42" rx="12" fill="${shirt}"/><path d="${A}" fill="none" stroke="${shirt}" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
${H.map(h=>`<circle cx="${h[0]}" cy="${h[1]}" r="4.5" fill="${sk}"/>`).join('')}<circle cy="-88" r="16" fill="${sk}"/>
<path d="M-16 -90a16 16 0 0 1 32 0q-8-7-16-5t-16 5z" fill="${o.hair||'#3B2A20'}"/><circle cx="-6" cy="-89" r="2.2" fill="${E}"/><circle cx="6" cy="-89" r="2.2" fill="${E}"/>${mouth}${ex}</g>`}
function face(m){const mo={happy:`<path d="M30 60q20 22 40 0z" fill="var(--faceline)"/><circle cx="26" cy="58" r="6" fill="var(--pink)"/><circle cx="74" cy="58" r="6" fill="var(--pink)"/>`,
  worry:`<path d="M36 66q14-6 28 0" fill="none" stroke="var(--faceline)" stroke-width="4" stroke-linecap="round"/><path d="M28 30l14 6M72 30l-14 6" stroke="var(--faceline)" stroke-width="3" stroke-linecap="round"/>`,
  sad:`<path d="M32 70q18-16 36 0" fill="none" stroke="var(--faceline)" stroke-width="4" stroke-linecap="round"/><path d="M30 50q-4 8 0 12 4-4 0-12z" fill="var(--water)"/>`}[m];

const S={level:1,sound:true,name:'',screen:'level',done:{},card:{},score:0,total:0,k:null,t:null};
try{const v=JSON.parse(localStorage.getItem('jasin-set')||'{}');if(v.level)S.level=v.level;if(v.sound===false)S.sound=false}catch(e){}
function save(){try{localStorage.setItem('jasin-set',JSON.stringify({level:S.level,sound:S.sound}))}catch(e){}}
function speak(t,rate){if(!S.sound)return;try{const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=rate||.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
let AC;
function tone(f,d,type,at){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;o.connect(g);g.connect(AC.destination);const t0=AC.currentTime+(at||0);g.gain.setValueAtTime(.15,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.start(t0);o.stop(t0+d)}catch(e){}}
const sfx={tap:()=>tone(660,.06),ok:()=>{tone(660,.1);tone(880,.16,'sine',.1)},bad:()=>tone(200,.22,'square'),done:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.2,'sine',i*.12))};
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function jong(w){const c=w.charCodeAt(w.length-1);return c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28>0}
const eul=w=>w+(jong(w)?'을':'를'), iye=w=>w+(jong(w)?'이에요':'예요'), iga=w=>w+(jong(w)?'이':'가');
const me=()=>S.name||'나';

const app=document.getElementById('app');
function render(){app.innerHTML=({level:levelScreen,home,think,shout,imagine,me:meScreen,animal,done,card})[S.screen]();bind()}
function hdr(title){return `<header><h1>${title}</h1><div class="row"><span class="badge">${LVNAME[S.level]}</span><button class="ghost" data-go="home">처음 화면</button></div></header>`}
function prog(){const t=S.t;let s='<div class="progress" aria-label="진행">';for(let i=0;i<t.n;i++)s+=`<i class="${i<t.i?'on':''}"></i>`;return s+'</div>'}
const fb=()=>`<div class="fb ${S.t.res||''}" role="status">${esc(S.t.msg||'')}</div>`;
const stepsBar=(names,cur)=>`<div class="steps">${names.map((n,i)=>`<span class="${i===cur?'cur':i<cur?'past':''}">${i+1}. ${esc(n)}</span>`).join('')}</div>`;
const order=html=>`<div class="panel"><div class="order"><div class="q">활동 안내</div><div class="big">${html}</div></div></div>`;
const NOW=x=>S.level<3&&x?'now':'';

/* ================= 화면 ================= */
function levelScreen(){const D={1:['하','그림을 보고 해요','얼굴 그림 단서, 선택지 2개, 반짝이는 단추 안내'],2:['중','글을 읽고 골라요','글 단서, 선택지 3개, 진로 질문 추가'],3:['상','스스로 판단해요','나쁜 생각 바꾸기, 응원 문장 만들기, 답 직접 쓰기, 이유 3개']};
  return `<header><h1>자신감 UP! <span class="y">자존감 UP!</span></h1><span class="badge">I MY ME MINE · 중학생 활동</span></header>
${SCENE}
<div class="panel"><div class="q">닮은 듯 다른 자존감과 자신감</div><div class="row" style="align-items:flex-start">
<div class="tx" style="flex:1 1 260px"><b style="color:var(--d3)">자존감</b><span class="sub">있는 그대로의 나를 가치 있게 여기는 마음<br>「나는 소중한 사람이야」</span></div>
<div class="tx" style="flex:1 1 260px"><b style="color:var(--d4)">자신감</b><span class="sub">어떤 일을 해낼 수 있다고 믿는 마음<br>「나는 할 수 있어」</span></div></div></div>
<p class="sub" style="margin:0">먼저 난이도를 고르세요. 선생님과 함께 골라도 좋아요.</p>
<div class="tiles">${[1,2,3].map(l=>`<button class="tile" data-lv="${l}"><span class="nm" style="font-size:56px;line-height:1">${D[l][0]}</span><span class="nm">난이도 ${D[l][0]}</span><span class="q">${D[l][1]}</span><span class="ds">${D[l][2]}</span></button>`).join('')}</div>`}

function home(){const ks=Object.keys(TASKS),n=ks.filter(k=>S.done[k]).length,all=n===ks.length;return `
<header><h1>자신감 UP! <span class="y">자존감 UP!</span></h1><div class="row"><span class="badge">${LVNAME[S.level]}</span><button class="ghost" data-go="level">난이도 다시 고르기</button></div></header>
${SCENE}
<div class="panel"><div class="namefield"><label for="nm" class="q">내 이름</label><input id="nm" maxlength="6" autocomplete="off" placeholder="이름 쓰기" value="${esc(S.name)}"><span class="sub">그림과 자신감 카드에 나와요. 비워 두어도 돼요.</span></div></div>

${n?`<div class="panel" style="align-items:center;text-align:center"><div class="q">${all?'오늘 활동을 모두 마쳤어요':'마친 활동이 카드에 모이고 있어요'}</div>${all?'<div class="stamp pop">칭찬<small>합시다!</small></div>':''}<div class="row" style="justify-content:center"><button class="primary" data-go="card">나의 자신감 카드 보기</button>${all?'<button id="reset">처음부터 다시 하기</button>':''}</div></div>`:''}
<div class="panel settings"><div class="row"><button id="snd">${S.sound?'소리 켜짐':'소리 꺼짐'}</button><span class="sub">효과음과 읽어 주는 소리를 들려줍니다.</span></div></div>`}

function make(k){const L=S.level;
  if(k==='think'){const items=shuffle(SIT).slice(0,4).map(s=>{const ch=L===1?[{t:s.good,g:1},{t:s.bad[0]}]:L===2?[{t:s.good,g:1},{t:s.bad[0]},{t:s.bad[1]}]:[{t:s.good,g:1},{t:s.bad[1]},{t:s.bad[2]}];return Object.assign({},s,{ch:shuffle(ch)})});
    return {i:0,n:4,items,wrong:[],solved:false,said:false,mood:30}}
  if(k==='shout')return {i:0,n:4,stage:0,sent:null,how:null,what:null,heard:false};
  if(k==='imagine'){const steps=IMG_BY_LV[L];return {i:0,n:steps.length+1,steps,ans:{},jobs:L===1?shuffle(JOBS).slice(0,3):JOBS,count:null,imagined:false}}
  if(k==='me'){const qs=MEQ_BY_LV[L].map(q=>MEQ.find(x=>x.k===q));return {i:0,n:qs.length+1,qs,ans:{},icons:[],open:0,reveal:false,draft:''}}
  return {i:0,n:3,need:L,pick:null,tr:[],pool:[],read:false}}

/* 활동 1 */
function think(){const t=S.t,s=t.items[t.i],L=S.level;const st=!t.solved?0:!t.said?1:2;
  const todo=[L===3?'나쁜 생각을 바꿀 좋은 생각을 고르세요':'좋은 생각을 고르세요','「따라 말하기」를 누르고 소리 내어 말해 보세요','「다음」을 누르세요'][st];
  const mood=t.solved?'happy':t.wrong.length?'sad':'worry';
  const cloud=t.solved?`<div class="cloud ok pop">「${esc(s.good)}」</div>`:L===3?`<div class="cloud bad">「${esc(s.bad[0])}」</div>`:t.wrong.length?`<div class="cloud bad">「${esc(s.ch[t.wrong[t.wrong.length-1]].t)}」</div>`:`<div class="cloud">어떤 생각을 할까?</div>`;
  return `${hdr(TASKS.think.nm)}${prog()}
${order(L===3?'나쁜 생각이 떠올랐어요. <b>좋은 생각</b>으로 바꿔 주세요.':'같은 일이라도 <b>어떻게 생각하느냐</b>에 따라 기분과 행동이 달라져요.')}
<div class="panel">${stepsBar(['좋은 생각 고르기','따라 말하기','다음 상황'],st)}<div class="todo">지금 할 일: ${todo}</div>
<div class="think"><div class="pic">${sitSVG(s.p)}</div><div class="tx" style="gap:10px"><span class="sub">상황 ${t.i+1} / ${t.n}</span><span class="sitx">${esc(s.s)}</span></div></div>
<div class="mind">${face(mood)}${cloud}</div>
<div class="meter"><span>마음 날씨</span><span class="bar"><i style="width:${t.solved?100:t.wrong.length?12:40}%"></i></span><span>${t.solved?'맑음':t.wrong.length?'비':'흐림'}</span></div>
${t.solved?'':`<div class="choices">${s.ch.map((c,j)=>`<button class="choice ${t.wrong.includes(j)?'wrong':''}" data-ch="${j}" ${t.wrong.includes(j)?'disabled':''}>${L===1?smallFace(!!c.g):''}<span>「${esc(c.t)}」</span></button>`).join('')}</div>`}
${fb()}
${t.solved?`<div class="row"><button id="say" class="${NOW(st===1)}"><span class="stepno">2</span> 따라 말하기</button><button class="primary ${NOW(st===2)}" id="next" ${t.said||S.level===3?'':'disabled'}>${t.i+1<t.n?'다음 상황':'다 했어요'}</button></div>`:''}</div>`}

function shoutSVG(v){return `<svg class="who" viewBox="0 0 260 220" aria-hidden="true"><rect y="196" width="260" height="24" fill="var(--floor)"/>${person(110,200,1.35,'var(--accent)',{arm:v.arm,face:v.face,shine:v.waves===3})}
${Array.from({length:v.waves},(_,i)=>`<path d="M${170+i*18} ${70-i*14}q${16+i*8} ${30+i*14} 0 ${60+i*28}" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/>`).join('')}
<rect x="80" y="204" width="60" height="16" rx="8" fill="var(--accent)"/><text x="110" y="216" text-anchor="middle" font-family="Noto Sans KR,sans-serif" font-size="11" font-weight="900" fill="#FFF">${esc(me()).slice(0,5)}</text></svg>`}
function shout(){const t=S.t,L=S.level;
  if(t.stage===0){const list=L===1?CHEERS.slice(0,2):CHEERS;
    return `${hdr(TASKS.shout.nm)}${prog()}${order('나를 응원하는 말을 골라서 <b>작게 → 보통 → 크게</b> 세 번 외쳐요.')}
<div class="panel">${stepsBar(['문장 고르기','작게','보통','크게 크게'],0)}<div class="todo">지금 할 일: ${t.sent?'「이 말로 외치기」를 누르세요':'나를 응원하는 말을 고르세요'}</div>
<div class="choices">${list.map((c,j)=>`<button class="choice ${t.sent===c?'sel':''} ${NOW(!t.sent&&L===1&&j===0)}" data-cheer="${j}">${icon('heart')}<span>「${esc(c)}」</span></button>`).join('')}</div>
${L===3?`<div class="builder"><div class="q">또는 내 문장 만들기: 「나는 <u>${t.how?esc(t.how):'　　　'}</u> <u>${t.what?esc(t.what):'　　　'}</u> 할 수 있어!」</div>
<div class="chips">${HOW.map(h=>`<button data-how="${h}" class="${t.how===h?'sel':''}">${h}</button>`).join('')}</div>
<div class="chips">${WHAT.map(h=>`<button data-what="${h}" class="${t.what===h?'sel':''}">${h}</button>`).join('')}</div></div>`:''}
${fb()}<div class="row"><button class="primary ${NOW(!!t.sent)}" id="gosh" ${t.sent?'':'disabled'}>이 말로 외치기</button></div></div>`}
  const r=t.stage-1,v=VOL[r];
  return `${hdr(TASKS.shout.nm)}${prog()}${order(`${r+1}번째: <b>${v.nm}</b> 외쳐 보세요.`)}
<div class="panel">${stepsBar(['문장 고르기','작게','보통','크게 크게'],t.stage)}<div class="todo">지금 할 일: ${!t.heard&&L<3?'「들어 보기」로 먼저 들어 보세요':`${v.nm} 소리 내어 말하고 「말했어요」를 누르세요`}</div>
<div class="shoutbox">${shoutSVG(v)}<div class="say pop" style="font-size:${v.fs}px">${esc(t.sent)}</div><div class="vol" aria-label="목소리 크기 ${v.bars} / 5">${[1,2,3,4,5].map(b=>`<i class="${b<=v.bars?'on':''}"></i>`).join('')}</div></div>
${fb()}<div class="row"><button id="listen" class="${NOW(!t.heard)}"><span class="stepno">1</span> 들어 보기</button><button class="primary ${NOW(t.heard)}" id="said"><span class="stepno">2</span> ${r<2?'말했어요':'크게 외쳤어요!'}</button></div></div>`}

/* 활동 3 */
function imgSentence(a){let s='나는 '+(a.place?a.place.v+'에서 ':'')+(a.who?a.who.v+' 앞에서 ':'')+(a.look?a.look.v+' ':'')+'멋지게 '+(a.job&&a.job.d?a.job.d:eul(a.job?a.job.v:'일')+' 할')+' 수 있어!';
  if(a.react)s+=' '+(a.who?iga(a.who.v):'사람들이')+' '+a.react.v+'.';return s}
function imagine(){const t=S.t,names=t.steps.map(k=>IMG_STEPS[k].nm).concat(['눈 감고 상상하기']);
  if(t.i<t.steps.length){const key=t.steps[t.i],st=IMG_STEPS[key],opts=key==='job'?t.jobs:st.opts;
    return `${hdr(TASKS.imagine.nm)}${prog()}${order('내가 잘하고 싶은 일을 <b>멋지게 해내는 모습</b>을 하나씩 그려요.')}
<div class="panel">${stepsBar(names,t.i)}<div class="todo">지금 할 일: ${esc(st.q)}</div>
<div class="stage">${stageSVG(t.ans)}</div>
<div class="picks">${opts.map((o,j)=>`<button class="pick" data-img="${j}">${icon(o.i)}<span>${esc(o.v)}</span></button>`).join('')}</div>${fb()}</div>`}
  const s=imgSentence(t.ans),running=t.count!==null&&t.count>0;
  return `${hdr(TASKS.imagine.nm)}${prog()}${order('완성한 그림을 보고, <b>눈을 감고 10초</b> 동안 그 모습을 떠올려요.')}
<div class="panel">${stepsBar(names,t.steps.length)}<div class="todo">지금 할 일: ${!t.imagined?(running?'눈을 감고 그 모습을 떠올리세요':'「눈 감고 10초 상상하기」를 누르세요'):'「다 했어요」를 누르세요'}</div>
<div class="stage">${stageSVG(t.ans)}</div><div class="dream">「${esc(s)}」</div>
${t.count!==null?`<div class="timer" aria-live="polite">${t.count>0?t.count:'눈을 떠요!'}</div>`:''}
<div class="row" style="justify-content:center"><button id="readimg">읽어 주기</button><button id="eyes" class="${NOW(!t.imagined&&!running)}" ${running?'disabled':''}>눈 감고 10초 상상하기</button><button class="primary ${NOW(t.imagined)}" id="imgdone" ${t.imagined||S.level===3?'':'disabled'}>다 했어요</button></div></div>`}

/* 활동 4 */
function meScreen(){const t=S.t,L=S.level,names=t.qs.map((_,i)=>'질문 '+(i+1)).concat(['이미지 게임']);
  if(t.i<t.qs.length){const q=t.qs[t.i],opts=L===1?q.opts.slice(0,4):q.opts;
    return `${hdr(TASKS.me.nm)}${prog()}${order('질문에 답하면 거울에 <b>나의 참모습 스티커</b>가 붙어요.')}
<div class="panel">${stepsBar(names,t.i)}<div class="todo">지금 할 일: ${esc(q.q)}</div>
<div class="mirrorwrap">${mirrorSVG(t.icons)}<div class="tx" style="gap:8px"><span class="sub">질문 ${t.i+1} / ${t.qs.length}</span><span class="sitx">${esc(q.q)}</span></div></div>
<div class="picks">${opts.map((o,j)=>`<button class="pick" data-me="${j}">${icon(o[0])}<span>${esc(o[1])}</span></button>`).join('')}</div>
${L===3?`<div class="write"><label for="mew" class="sub" style="flex-basis:100%">고를 것이 없으면 직접 써도 돼요.</label><input id="mew" maxlength="20" autocomplete="off" placeholder="직접 쓰기" value="${esc(t.draft)}"><button id="mewok" class="primary">이걸로 할래요</button></div>`:''}
${fb()}</div>`}
  const hints=t.qs.map(q=>q.hint(t.ans[q.k])),all=t.open>=hints.length;
  return `${hdr(TASKS.me.nm)}${prog()}${order('이미지 게임: 「<b>나는 누구일까요?</b>」 카드를 하나씩 뒤집어 친구들에게 보여 주세요.')}
<div class="panel">${stepsBar(names,t.qs.length)}<div class="todo">지금 할 일: ${!all?`${t.open+1}번 카드를 뒤집으세요`:!t.reveal?'친구들이 맞혔으면 「정답 공개」를 누르세요':'「다 했어요」를 누르세요'}</div>
<div class="hcards">${hints.map((h,j)=>j<t.open?`<div class="hcard open pop">${icon(t.icons[j])}<span>${esc(h)}</span></div>`:`<button class="hcard back ${NOW(j===t.open)}" data-hint="${j}" ${j===t.open?'':'disabled'}><b>?</b><span>힌트 ${j+1}</span></button>`).join('')}</div>
${t.reveal?`<div class="answer pop">정답은 바로 「${esc(me())}」!</div>`:''}
<div class="row"><button id="readhint" ${t.open?'':'disabled'}>힌트 읽어 주기</button><button id="reveal" class="${NOW(all&&!t.reveal)}" ${all&&!t.reveal?'':'disabled'}>정답 공개</button><button class="primary ${NOW(t.reveal)}" id="medone" ${t.reveal?'':'disabled'}>다 했어요</button></div></div>`}

/* 활동 5 */
function animalSpeech(t){const a=t.pick,tr=t.tr.map(i=>TRAITS[i]);let why;
  if(tr.length===1)why=`그 이유는 ${tr[0].k} 때문이다.`;
  else why='그 이유는 '+tr.map((x,j)=>`${ORD[j]}, ${j<tr.length-1?x.a:x.k}`).join('<br>')+'<br>때문이다.';
  return {html:`나는 <b>${esc(a.v)}</b>이다.<br><br>${why}<br><br>그래서 나는 <b>${esc(a.v)}</b>이다.`,text:`나는 ${a.v}이다. ${why.replace(/<br>/g,' ')} 그래서 나는 ${a.v}이다.`}}
function podiumSVG(k){return `<svg viewBox="0 0 220 240" aria-hidden="true"><rect width="220" height="240" fill="var(--wall)"/><rect y="214" width="220" height="26" fill="var(--floor)"/><rect x="40" y="16" width="140" height="96" rx="6" fill="var(--paper)" stroke="var(--line)" stroke-width="3"/><svg x="70" y="20" width="80" height="80" viewBox="0 0 100 100">${AN[k]}</svg><path d="M110 112v20" stroke="var(--metal)" stroke-width="3"/>${person(110,214,.95,'var(--accent)',{arm:'mic',face:'open'})}<path d="M70 160h80l-8 56H78z" fill="var(--wood)"/><rect x="66" y="152" width="88" height="12" rx="3" fill="var(--wood-dark)"/></svg>`}
function animal(){const t=S.t,L=S.level,names=['동물·식물 고르기','이유 고르기','발표하기'];
  if(t.i===0)return `${hdr(TASKS.animal.nm)}${prog()}${order('「나는 <b>사자</b>이다. 그 이유는…」처럼 나를 닮은 동물이나 식물로 나를 소개해요.')}
<div class="panel">${stepsBar(names,0)}<div class="todo">지금 할 일: 나를 닮은 동물이나 식물을 고르세요</div>
<div class="picks">${(L===1?ANIMALS.slice(0,6):ANIMALS).map((a,j)=>`<button class="pick an" data-an="${j}">${anSVG(a.k)}<span>${esc(a.v)}</span></button>`).join('')}</div>${fb()}</div>`;
  if(t.i===1){const left=t.need-t.tr.length;
    return `${hdr(TASKS.animal.nm)}${prog()}${order(`왜 내가 <b>${esc(t.pick.v)}</b>일까요? 이유를 <b>${t.need}개</b> 골라요.`)}
<div class="panel">${stepsBar(names,1)}<div class="todo">지금 할 일: ${left>0?`이유를 ${left}개 더 고르세요`:'「발표문 만들기」를 누르세요'}</div>
<div class="think"><div class="pic">${anSVG(t.pick.k)}</div><div class="tx"><span class="sitx">나는 ${esc(t.pick.v)}이다.</span><span class="sub">고른 이유를 다시 누르면 취소돼요.</span></div></div>
<div class="chips">${t.pool.map(i=>{const o=t.tr.indexOf(i);return `<button data-tr="${i}" class="${o>=0?'sel':''} ${NOW(L===1&&left>0&&t.pick.t.includes(i))}">${o>=0?`<span class="no">${o+1}</span>`:''}${esc(TRAITS[i].t)}</button>`}).join('')}</div>${fb()}
<div class="row"><button class="ghost" id="anback">다시 고르기</button><button class="primary ${NOW(left===0)}" id="anok" ${left===0?'':'disabled'}>발표문 만들기</button></div></div>`}
  const sp=animalSpeech(t);
  return `${hdr(TASKS.animal.nm)}${prog()}${order('발표 원고를 보고 친구들 앞에서 <b>크고 또박또박</b> 발표해요.')}
<div class="panel">${stepsBar(names,2)}<div class="todo">지금 할 일: ${!t.read&&L<3?'「읽어 주기」로 먼저 들어 보세요':'발표하고 「발표했어요」를 누르세요'}</div>
<div class="present">${podiumSVG(t.pick.k)}<div class="script">${sp.html}</div></div>${fb()}
<div class="row"><button id="readan" class="${NOW(!t.read)}"><span class="stepno">1</span> 읽어 주기</button><button class="primary ${NOW(t.read)}" id="andone"><span class="stepno">2</span> 발표했어요</button></div></div>`}

function done(){return `${hdr('활동 보고')}
<div class="panel" style="align-items:center;text-align:center">
<div class="q">「${TASKS[S.k].nm}」 활동을 마쳤어요</div>
${S.k==='think'?`<div class="sub">한 번에 고른 좋은 생각 ${S.score} / ${S.total}</div>`:''}
${S.reported?`<div class="stamp pop">칭찬<small>${esc(S.praise)}!</small></div>`:''}
<div class="sub">선생님께 활동 보고를 해 보세요.</div>
<div class="row" style="justify-content:center"><button class="primary ${NOW(!S.reported)}" id="report">「다 했습니다. 확인해 주세요.」</button><button class="${NOW(S.reported)}" data-go="home">다음 활동 고르기</button></div></div>`}

function cardText(){const c=S.card,L=[`${me()}의 자신감 카드`];
  if(c.think)L.push('좋은 생각: '+c.think);if(c.shout)L.push('응원하는 말: '+c.shout);if(c.imagine)L.push('상상한 내 모습: '+c.imagine);
  if(c.me)L.push('나의 참모습: '+c.me.join(' '));if(c.animal)L.push('나를 표현하기: '+c.animal.text);return L.join('\n')}
function card(){const c=S.card,all=Object.keys(TASKS).every(k=>S.done[k]);
  const row=(k,v)=>`<div class="mrow"><span class="k">${TASKS[k].nm}</span><span class="v ${v?'':'empty'}">${v||'아직 안 했어요'}</span></div>`;
  return `${hdr('나의 자신감 카드')}
<div class="idcard"><div class="ph">${c.animal?anSVG(c.animal.k):`<svg viewBox="0 0 120 140" aria-hidden="true"><rect width="120" height="140" fill="var(--sky)"/>${person(60,138,1,'var(--accent)',{face:'big'})}</svg>`}</div>
<div class="tx" style="gap:6px;align-items:stretch"><span class="nm">${esc(me())}</span><span class="sub">나는 뭐든지 할 수 있어!</span>
${row('think',c.think&&`「${esc(c.think)}」`)}${row('shout',c.shout&&`「${esc(c.shout)}」`)}${row('imagine',c.imagine&&`「${esc(c.imagine)}」`)}${row('me',c.me&&c.me.map(esc).join('<br>'))}${row('animal',c.animal&&esc(c.animal.text))}</div></div>
${all?'<div class="stamp pop">칭찬<small>합시다!</small></div>':''}
<div class="row"><button id="readcard">카드 읽어 주기</button><button id="copycard">카드 내용 복사</button><button class="primary" data-go="home">처음 화면</button></div>
<div class="fb" id="copymsg" role="status"></div>`}

/* ================= 동작 ================= */
function mark(ok){const t=S.t;if(!t.counted){S.total++;t.counted=true;if(ok)S.score++}}
function say(msg,res){S.t.msg=msg;S.t.res=res;(res==='ok'?sfx.ok:sfx.bad)()}
function finish(){S.done[S.k]=true;S.reported=false;S.screen='done';sfx.done();render();window.scrollTo(0,0)}
function start(k){S.k=k;S.screen=k;S.score=0;S.total=0;S.t=make(k);S.t.msg='';S.t.res='';render();window.scrollTo(0,0);speak(TASKS[k].say)}
let TIMER=null;
function bind(){const $=id=>document.getElementById(id),all=s=>app.querySelectorAll(s),t=S.t;
  all('[data-go]').forEach(b=>b.onclick=()=>{try{speechSynthesis.cancel()}catch(e){};clearInterval(TIMER);S.screen=b.dataset.go;render();window.scrollTo(0,0)});
  all('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start));
  all('[data-lv]').forEach(b=>b.onclick=()=>{S.level=+b.dataset.lv;S.screen='home';S.done={};S.card={};save();render()});
  if($('nm'))$('nm').oninput=e=>{S.name=e.target.value.trim()};
  if($('snd'))$('snd').onclick=()=>{S.sound=!S.sound;save();render()};
  if($('reset'))$('reset').onclick=()=>{S.done={};S.card={};render()};
  if($('report'))$('report').onclick=()=>{S.praise=PRAISE[Math.floor(Math.random()*PRAISE.length)];S.reported=true;speak('다 했습니다. 확인해 주세요. 칭찬합시다!');render()};
  /* 좋은 생각 */
  all('[data-ch]').forEach(b=>b.onclick=()=>{const j=+b.dataset.ch,s=t.items[t.i];
    if(s.ch[j].g){mark(true);t.solved=true;S.card.think=s.good;say('좋은 생각을 골랐어요! 마음이 맑아졌어요.','ok');speak(s.good)}
    else{mark(false);t.wrong.push(j);say('그렇게 생각하면 마음이 어떨까요? 다시 골라 보세요.','bad')}render()});
  if($('say'))$('say').onclick=()=>{speak(t.items[t.i].good);t.said=true;t.msg='소리 내어 따라 말해 보세요.';t.res='ok';render()};
  if($('next'))$('next').onclick=()=>{t.i++;t.counted=false;if(t.i>=t.n){finish();return}Object.assign(t,{wrong:[],solved:false,said:false,msg:'',res:''});render()};
  /* 크게 크게 */
  all('[data-cheer]').forEach(b=>b.onclick=()=>{const list=S.level===1?CHEERS.slice(0,2):CHEERS;t.sent=list[+b.dataset.cheer];t.how=t.what=null;t.msg='';sfx.tap();speak(t.sent);render()});
  const built=()=>{if(t.how&&t.what){t.sent=`나는 ${t.how} ${t.what} 할 수 있어!`;speak(t.sent)}else t.sent=null};
  all('[data-how]').forEach(b=>b.onclick=()=>{t.how=b.dataset.how;built();sfx.tap();render()});
  all('[data-what]').forEach(b=>b.onclick=()=>{t.what=b.dataset.what;built();sfx.tap();render()});
  if($('gosh'))$('gosh').onclick=()=>{if(!t.sent)return;S.card.shout=t.sent;t.stage=1;t.i=1;t.heard=false;t.msg='';render()};
  if($('listen'))$('listen').onclick=()=>{speak(t.sent,[.8,.9,1][t.stage-1]);t.heard=true;render()};
  if($('said'))$('said').onclick=()=>{if(t.stage>=3){t.i=4;finish();return}t.stage++;t.i=t.stage;t.heard=false;say(t.stage===2?'좋아요! 이번엔 보통 목소리로!':'이번엔 가슴을 펴고 크게 크게!','ok');render()};
  /* 상상하기 */
  all('[data-img]').forEach(b=>b.onclick=()=>{const key=t.steps[t.i],opts=key==='job'?t.jobs:IMG_STEPS[key].opts;t.ans[key]=opts[+b.dataset.img];sfx.tap();t.i++;t.msg='';
    if(t.i>=t.steps.length){S.card.imagine=imgSentence(t.ans);speak(S.card.imagine)}render()});
  if($('readimg'))$('readimg').onclick=()=>speak(imgSentence(t.ans));
  if($('eyes'))$('eyes').onclick=()=>{clearInterval(TIMER);t.count=10;speak('눈을 감고 상상해 보세요.');render();
    TIMER=setInterval(()=>{if(S.screen!=='imagine'||S.t!==t){clearInterval(TIMER);return}t.count--;
      if(t.count<=0){clearInterval(TIMER);t.count=0;t.imagined=true;sfx.done();speak('눈을 떠 보세요. '+imgSentence(t.ans))}else tone(520,.05);render()},1000)};
  if($('imgdone'))$('imgdone').onclick=()=>{clearInterval(TIMER);t.i=t.n;finish()};
  /* 참모습 */
  const answer=(v,ic)=>{const q=t.qs[t.i];t.ans[q.k]=v;t.icons.push(ic);t.draft='';t.msg='';sfx.ok();t.i++;
    if(t.i>=t.qs.length)S.card.me=t.qs.map(x=>x.hint(t.ans[x.k]));render()};
  all('[data-me]').forEach(b=>b.onclick=()=>{const o=t.qs[t.i].opts[+b.dataset.me];answer(o[1],o[0])});
  if($('mew'))$('mew').oninput=e=>{t.draft=e.target.value};
  if($('mewok'))$('mewok').onclick=()=>{const v=(t.draft||'').trim();if(!v){say('빈 칸이에요. 직접 쓰거나 그림을 골라 주세요.','bad');render();return}answer(v,'pen')};
  all('[data-hint]').forEach(b=>b.onclick=()=>{t.open++;const q=t.qs[t.open-1];speak(q.hint(t.ans[q.k]));sfx.tap();render()});
  if($('readhint'))$('readhint').onclick=()=>{const q=t.qs[t.open-1];speak(q.hint(t.ans[q.k]))};
  if($('reveal'))$('reveal').onclick=()=>{t.reveal=true;sfx.ok();speak('정답은 바로 '+me()+'!');render()};
  if($('medone'))$('medone').onclick=()=>{t.i=t.n;finish()};
  /* 나를 표현하기 */
  all('[data-an]').forEach(b=>b.onclick=()=>{const a=ANIMALS[+b.dataset.an];t.pick=a;t.tr=[];
    const others=shuffle(TRAITS.map((_,i)=>i).filter(i=>!a.t.includes(i)));
    t.pool=S.level===1?shuffle(a.t.concat(others.slice(0,2))):S.level===2?shuffle(a.t.concat(others.slice(0,6))):TRAITS.map((_,i)=>i);
    t.i=1;t.msg='';sfx.tap();speak('나는 '+a.v+'이다.');render()});
  all('[data-tr]').forEach(b=>b.onclick=()=>{const i=+b.dataset.tr,o=t.tr.indexOf(i);
    if(o>=0)t.tr.splice(o,1);else if(t.tr.length<t.need)t.tr.push(i);else{say(`이유는 ${t.need}개만 골라요. 고른 것을 다시 누르면 취소돼요.`,'bad');render();return}
    t.msg='';sfx.tap();render()});
  if($('anback'))$('anback').onclick=()=>{t.i=0;t.pick=null;t.tr=[];t.msg='';render()};
  if($('anok'))$('anok').onclick=()=>{t.i=2;t.read=false;const sp=animalSpeech(t);S.card.animal={k:t.pick.k,text:sp.text};render()};
  if($('readan'))$('readan').onclick=()=>{speak(animalSpeech(t).text,.85);t.read=true;render()};
  if($('andone'))$('andone').onclick=()=>{t.i=3;finish()};
  /* 카드 */
  if($('readcard'))$('readcard').onclick=()=>speak(cardText().replace(/\n/g,'. '));
  if($('copycard'))$('copycard').onclick=()=>{const m=$('copymsg'),fail=()=>{m.textContent='복사가 안 돼요. 카드 글자를 길게 눌러 직접 복사해 주세요.';m.className='fb bad'};
    try{navigator.clipboard.writeText(cardText()).then(()=>{m.textContent='복사했어요. 원하는 곳에 붙여 넣으세요.';m.className='fb ok'},fail)}catch(e){fail()}};
}
render();
</script>
