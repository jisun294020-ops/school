<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#fff;font-family:"WenQuanYi Zen Hei","Malgun Gothic",sans-serif}
#cap{display:inline-block;padding:24px 50px 30px 24px;background:#fff;position:relative}
.obj{color:#7a7f8c;font-size:17px;margin:0 0 18px 8px;display:flex;align-items:center;gap:8px}
.obj i{width:22px;height:22px;border-radius:4px;background:#d9cbb8;display:inline-block}
.script{display:flex;flex-direction:column;align-items:flex-start;position:relative;margin-bottom:40px}
.script:last-child{margin-bottom:0}
.b{position:relative;display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 8px 0 18px;border-radius:4px 23px 23px 4px;color:#fff;font-weight:bold;font-size:19px;white-space:nowrap;z-index:1;background:var(--c)}
.b:after{content:"";position:absolute;left:12px;bottom:-9px;border-left:9px solid transparent;border-right:9px solid transparent;border-top:9px solid var(--c);z-index:2}
.ic{width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;font-size:12px;color:rgba(255,255,255,.7)}
.dd{background:rgba(0,0,0,.22);border-radius:6px;padding:5px 10px;font-size:16px}
.dd:after{content:" ▾";font-size:13px}
.hex{display:inline-flex;align-items:center;gap:10px;height:38px;padding:0 22px;clip-path:polygon(15px 0,calc(100% - 15px) 0,100% 50%,calc(100% - 15px) 100%,15px 100%,0 50%);font-size:17px}
.rp{display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:17px;font-size:16px;color:#fff}
.slot{border:2px solid rgba(0,0,0,.15);border-radius:18px;padding:3px 6px;display:inline-flex}
.str{background:#f6d77a;color:#3a3020;border-radius:18px;padding:5px 14px;font-size:16px}
.num{background:#f6d77a;color:#3a3020;border-radius:17px;min-width:32px;height:32px;padding:0 6px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:16px}
.c{display:flex;flex-direction:column;align-items:flex-start;position:relative}
.body{border-left:24px solid var(--c);margin-top:-2px;padding-top:1px;display:flex;flex-direction:column;align-items:flex-start;min-height:30px}
.mid{background:var(--c);height:40px;border-radius:0 20px 20px 0;margin-top:-1px;color:#fff;font-weight:bold;font-size:19px;display:flex;align-items:center;padding-left:18px;box-sizing:border-box}
.foot{background:var(--c);height:26px;border-radius:0 13px 13px 4px;margin-top:-1px}
.hat{border-radius:30px 26px 26px 30px;height:52px;padding-left:8px;gap:12px;margin-left:-6px}
.hatc{width:42px;height:42px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 4px #3f9b45}
.red{position:absolute;border:2.5px solid #e04b45;border-radius:4px;z-index:5;pointer-events:none}
</style></head><body><div id="cap"></div>
<script>
const COL={start:"#4aa84e",flow:"#6cb6e6",move:"#8f4fbf",looks:"#c9344a",ai:"#6c4f9e",data:"#a6449b",sound:"#79b947",judge:"#4a4c9c",calc:"#eea23a"};
const ICON={
 flow:'<svg width="18" height="16"><circle cx="9" cy="3" r="2.4" fill="#cfe6f6"/><circle cx="3" cy="13" r="2.4" fill="#cfe6f6"/><circle cx="15" cy="13" r="2.4" fill="#cfe6f6"/><path d="M9 3 L3 13 M9 3 L15 13" stroke="#cfe6f6" stroke-width="2"/></svg>',
 looks:'<svg width="18" height="18"><circle cx="9" cy="5" r="3.6" fill="#f0b7c0"/><circle cx="4.5" cy="12.5" r="3.6" fill="#f0b7c0"/><circle cx="13.5" cy="12.5" r="3.6" fill="#f0b7c0"/></svg>',
 start:'<svg width="16" height="18"><path d="M3 1v16M3 2h10l-3 4 3 4H3" stroke="#bfe3bf" stroke-width="2" fill="#bfe3bf"/></svg>',
 ai:'<span style="font-weight:bold">AI</span>', data:'<span style="font-size:18px;font-weight:bold">?</span>',
 sound:'<svg width="18" height="16"><path d="M2 5h4l5-4v14l-5-4H2z" fill="#d6ecc4"/></svg>',
 move:'<svg width="18" height="14"><path d="M1 4h13M10 1l4 3-4 3M17 10H4M8 7l-4 3 4 3" stroke="#d9c2ee" stroke-width="2" fill="none"/></svg>'};
const PLAY='<svg width="18" height="20"><path d="M2 1 L17 10 L2 19Z" fill="#3f9b45"/></svg>';
const SIG='<svg width="24" height="24"><path d="M3 21 L10 13" stroke="#3f9b45" stroke-width="3"/><path d="M6 6 A10 10 0 0 0 18 18 Z" fill="#3f9b45"/><circle cx="17" cy="7" r="3" fill="#3f9b45"/></svg>';
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function parts(arr,host){ for(const p of arr){ if(typeof p==="string"){host.appendChild(el("span",null,p));continue;}
  if(p.dd!=null) host.appendChild(el("span","dd",p.dd));
  else if(p.s!=null) host.appendChild(el("span","str",p.s));
  else if(p.n!=null) host.appendChild(el("span","num",p.n));
  else if(p.slot){const s=el("span","slot");parts(p.slot,s);host.appendChild(s);}
  else if(p.hex){const h=el("span","hex");h.style.background=COL[p.c||"judge"];parts(p.hex,h);host.appendChild(h);}
  else if(p.rp){const r=el("span","rp");r.style.background=COL[p.c];parts(p.rp,r);host.appendChild(r);}
 } }
function block(b,host){
  let node;
  if(b.t==="raw"){ node=el("div"); node.style.display="inline-flex"; node.style.color="#fff"; node.style.fontWeight="bold"; parts(b.p,node); host.appendChild(node); return node; }
  if(b.t==="hat"){ node=el("div","b hat"); node.style.setProperty("--c",COL.start); node.appendChild(el("span","hatc",b.icon==="play"?PLAY:SIG)); parts(b.p,node); }
  else if(b.t==="cmd"){ node=el("div","b"); node.style.setProperty("--c",COL[b.c]); parts(b.p,node); node.appendChild(el("span","ic",ICON[b.c])); }
  else { // c-block
    node=el("div","c"); node.style.setProperty("--c",COL.flow);
    const h=el("div","b"); h.style.setProperty("--c",COL.flow); parts(b.p,h); h.appendChild(el("span","ic",ICON.flow)); node.appendChild(h);
    const bd=el("div","body"); b.body.forEach(x=>block(x,bd)); node.appendChild(bd);
    if(b.else){ const m=el("div","mid","아니면"); node.appendChild(m); const b2=el("div","body"); b.else.forEach(x=>block(x,b2)); node.appendChild(b2); m.dataset.mid=1; }
    const f=el("div","foot"); node.appendChild(f);
    host.appendChild(node);
    requestAnimationFrame(()=>{}); node._fix=()=>{ const w=h.getBoundingClientRect().width; f.style.width=(b.else?w:Math.max(150,w*0.55))+"px"; node.querySelectorAll(":scope>.mid").forEach(m=>m.style.width=w+"px"); };
  }
  if(node.className!=="c") host.appendChild(node);
  if(b.red) node.dataset.red=1;
  return node;
}
function render(spec){
  const cap=document.getElementById("cap");
  if(spec.bare){ document.body.style.background="transparent"; cap.style.background="transparent"; cap.style.padding="4px 16px 14px 10px"; }
  else cap.appendChild(el("div","obj","<i></i>"+spec.obj));
  for(const sc of spec.scripts){ const s=el("div","script"); cap.appendChild(s); sc.blocks.forEach(b=>block(b,s)); if(sc.red) s.dataset.red=1; }
  // fix C widths (inner first)
  [...cap.querySelectorAll(".c")].reverse().forEach(n=>n._fix&&n._fix());
  const c=cap.getBoundingClientRect();
  cap.querySelectorAll("[data-red]").forEach(n=>{ const r=n.getBoundingClientRect(); const d=el("div","red");
    Object.assign(d.style,{left:(r.left-c.left-10)+"px",top:(r.top-c.top-8)+"px",width:(r.width+24)+"px",height:(r.height+20)+"px"}); cap.appendChild(d); });
}
</script></body></html>
