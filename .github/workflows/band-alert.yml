name: 밴드 강사 공고 알림

on:
  schedule:
    - cron: "*/10 * * * *"   # 10분마다 (GitHub 사정에 따라 몇 분 늦어질 수 있음)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: band-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 새 공고 확인
        env:
          BAND_ACCESS_TOKEN: ${{ secrets.BAND_ACCESS_TOKEN }}
          BAND_KEYS: ${{ vars.BAND_KEYS }}
          BAND_KEYWORDS: ${{ vars.BAND_KEYWORDS }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
        run: python band-alert/band_alert.py

      - name: 확인한 글 기록 저장
        run: |
          git config user.name "band-alert-bot"
          git config user.email "band-alert-bot@users.noreply.github.com"
          git add band-alert/state.json
          git diff --cached --quiet || (git commit -m "band-alert: 확인한 글 기록 갱신" && git push)
